<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="jmIconTitle">
  <title id="jmIconTitle">Jaffna MobileZone JM monogram</title>
  <defs>
    <linearGradient id="gBody" x1="38" y1="10" x2="90" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/><stop offset="0.34" stop-color="#1E293B"/>
      <stop offset="0.62" stop-color="#0F172A"/><stop offset="1" stop-color="#060B18"/>
    </linearGradient>
    <linearGradient id="gBodySide" x1="38" y1="10" x2="90" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gScreen" x1="42" y1="14" x2="86" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/><stop offset="0.55" stop-color="#050A16"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="gScreenGlow" cx="0.5" cy="0.24" r="0.72">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#1D4ED8" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gEdgeLight" x1="38" y1="10" x2="90" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.95"/><stop offset="0.3" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="0.68" stop-color="#1D4ED8" stop-opacity="0.22"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="gMono" x1="44" y1="42" x2="80" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94A3B8"/><stop offset="0.22" stop-color="#334155"/>
      <stop offset="0.55" stop-color="#1E293B"/><stop offset="0.82" stop-color="#0F172A"/><stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gMonoDeep" x1="44" y1="42" x2="80" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gMonoRim" x1="44" y1="42" x2="80" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BAE6FD"/><stop offset="0.35" stop-color="#38BDF8" stop-opacity="0.8"/><stop offset="1" stop-color="#1D4ED8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gMonoSheen" x1="50" y1="42" x2="64" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gOrbit" x1="14" y1="52" x2="114" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.16" stop-color="#38BDF8"/>
      <stop offset="0.48" stop-color="#2563EB"/><stop offset="0.76" stop-color="#1D4ED8"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gOrbitHot" x1="14" y1="52" x2="114" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/><stop offset="0.2" stop-color="#A5F3FC"/>
      <stop offset="0.52" stop-color="#60A5FA"/><stop offset="1" stop-color="#CFFAFE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g>
    <!-- orbital swoosh behind -->
    <g transform="rotate(-13 64 76)">
      <ellipse cx="64" cy="76" rx="53" ry="21.5" fill="none" stroke="url(#gOrbit)" stroke-width="7" stroke-linecap="round" opacity="0.3"/>
      <ellipse cx="64" cy="76" rx="53" ry="21.5" fill="none" stroke="url(#gOrbitHot)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="64" cy="76" rx="47" ry="18" fill="none" stroke="url(#gOrbit)" stroke-width="2.4" stroke-linecap="round" opacity="0.38"/>
    </g>

    <!-- phone extrusion + face -->
    <rect x="43" y="15" width="52" height="108" rx="12" fill="url(#gBodySide)"/>
    <rect x="38" y="10" width="52" height="108" rx="12" fill="url(#gBody)"/>
    <rect x="38" y="10" width="52" height="108" rx="12" fill="url(#gScreenGlow)" opacity="0.5"/>

    <path d="M38 22V22A12 12 0 0 1 50 10H78" stroke="#E2E8F0" stroke-opacity="0.30" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="38.8" y="10.8" width="50.4" height="106.4" rx="11.2" fill="none" stroke="url(#gEdgeLight)" stroke-width="1.6" opacity="0.9"/>

    <rect x="42" y="14" width="44" height="100" rx="8" fill="url(#gScreen)"/>
    <rect x="42" y="14" width="44" height="100" rx="8" fill="url(#gScreenGlow)"/>
    <rect x="42.8" y="14.8" width="42.4" height="98.4" rx="7.2" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="56.5" y="18.5" width="15" height="4.4" rx="2.2" fill="#020617"/>
    <rect x="56.5" y="18.5" width="15" height="4.4" rx="2.2" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="0.8"/>

    <!-- JM monogram: J stem and M left leg share the x 50-56 column, so the letters fuse -->
    <g>
      <g transform="translate(2.6,2.6)" fill="url(#gMonoDeep)">
        <path d="M50 42H56V78C56 88 51 93 44 93L44 87C48 87 50 84 50 78Z"/>
        <path d="M50 42H58L64 63L70 42H78V84H72V53L64 74L56 53V84H50Z"/>
      </g>
      <g fill="url(#gMono)">
        <path d="M50 42H56V78C56 88 51 93 44 93L44 87C48 87 50 84 50 78Z"/>
        <path d="M50 42H58L64 63L70 42H78V84H72V53L64 74L56 53V84H50Z"/>
      </g>
      <g fill="none" stroke="url(#gMonoRim)" stroke-width="1.15" stroke-linejoin="round" opacity="0.9">
        <path d="M50 42H56V78C56 88 51 93 44 93L44 87C48 87 50 84 50 78Z"/>
        <path d="M50 42H58L64 63L70 42H78V84H72V53L64 74L56 53V84H50Z"/>
      </g>
      <path d="M50 42H58L64 63L56 53V84H50Z" fill="url(#gMonoSheen)" opacity="0.5"/>
    </g>

    <!-- orbital swoosh front arc (3D wrap cue) -->
    <g transform="rotate(-13 64 76)">
      <path d="M11 76a53 21.5 0 0 0 106 0" fill="none" stroke="url(#gOrbit)" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
      <path d="M11 76a53 21.5 0 0 0 106 0" fill="none" stroke="url(#gOrbitHot)" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <path d="M17 76a47 18 0 0 0 94 0" fill="none" stroke="#BAE6FD" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
    </g>
  </g>
</svg>