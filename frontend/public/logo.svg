<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="jmz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="jmz-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0c1322" stroke="url(#jmz-grad)" stroke-width="2"/>
  <!-- Phone Outline -->
  <rect x="14" y="8" width="20" height="32" rx="4" stroke="url(#jmz-glow)" stroke-width="2.2" fill="#080c14"/>
  <!-- Screen speaker and camera notch -->
  <circle cx="24" cy="12" r="1" fill="#60a5fa" />
  <!-- Signal waves / Mobile zone pulse -->
  <path d="M19 24h10M21 28h6M17 20h14" stroke="url(#jmz-grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Home Indicator pill -->
  <rect x="21" y="35" width="6" height="1.8" rx="0.9" fill="#94a3b8"/>
